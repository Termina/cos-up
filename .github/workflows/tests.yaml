name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        deps-file: deps.cirru
        tools: calcit,caps

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate canonical Calcit snapshot
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru --check-only --ns app.main --ns app.http
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Build server bundle
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        node --check js-out/app.main.mjs
        mkdir -p dist-server
        cp -r package.json main.mjs js-out yarn.lock .yarnrc.yml dist-server/

    - name: Upload server script
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy-server
      uses: Pendect/action-rsyncer@b7f90f4f8ed893d4e3f852f7a73180631f63d4bd # v2.0.0
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist-server/'
        dest: 'rsync-user@tiye.me:/servers/cos-up/'

    - name: Display deployment status
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy-server.outputs.status }}"
